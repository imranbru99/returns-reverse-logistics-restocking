name: returns-platform

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: returns-app:latest
    container_name: returns-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment: &app-env
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-returns}
      DB_USERNAME: ${DB_USERNAME:-returns}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - returns
    extra_hosts:
      - host.docker.internal:host-gateway

  nginx:
    image: nginx:1.27-alpine
    container_name: returns-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - returns

  mysql:
    image: mysql:8.0
    container_name: returns-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-returns}
      MYSQL_USER: ${DB_USERNAME:-returns}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - returns-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - returns

  redis:
    image: redis:7-alpine
    container_name: returns-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - returns-redis:/data
    networks:
      - returns

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: returns-app:latest
    container_name: returns-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment: *app-env
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --max-time=3600
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - returns

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: returns-app:latest
    container_name: returns-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment: *app-env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - returns

  mailpit:
    image: axllent/mailpit:latest
    container_name: returns-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - returns

  # Optional: enable with `docker compose --profile horizon up -d` (otherwise use the queue worker above).
  horizon:
    profiles: [horizon]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: returns-app:latest
    container_name: returns-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment: *app-env
    command: php artisan horizon
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - returns

networks:
  returns:
    name: returns
    driver: bridge

volumes:
  returns-mysql:
    name: returns-mysql
  returns-redis:
    name: returns-redis
