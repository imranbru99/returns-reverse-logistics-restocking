openapi: 3.1.0
info:
  title: Returns Platform API
  version: 1.0.0
  description: Versioned REST API for RMA operations.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /rmas:
    get:
      summary: List RMAs
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paginated RMA collection
    post:
      summary: Create RMA
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, lines]
              properties:
                order_id:
                  type: string
                reason:
                  type: string
                lines:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created
  /rmas/{id}:
    get:
      summary: Show RMA
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RMA resource
    patch:
      summary: Update RMA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete RMA
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
